name: Benchmark smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/others/Dockerfile
          platforms: linux/amd64
          tags: segmeter-bench:others
          load: true
          cache-from: type=gha,scope=benchmark-others
          cache-to: type=gha,scope=benchmark-others,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/giggle/Dockerfile
          platforms: linux/amd64
          tags: segmeter-bench:giggle
          load: true
          cache-from: type=gha,scope=benchmark-giggle
          cache-to: type=gha,scope=benchmark-giggle,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/rust-tools/Dockerfile
          platforms: linux/amd64
          tags: segmeter-bench:rust-tools
          load: true
          cache-from: type=gha,scope=benchmark-rust
          cache-to: type=gha,scope=benchmark-rust,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/genogrove/Dockerfile
          platforms: linux/amd64
          tags: segmeter-bench:genogrove
          load: true
          cache-from: type=gha,scope=benchmark-genogrove
          cache-to: type=gha,scope=benchmark-genogrove,mode=max
      - name: Benchmark base
        if: github.event_name == 'pull_request'
        run: python3 scripts/continuous_benchmark.py --source base --output results-base
      - name: Benchmark head
        run: python3 scripts/continuous_benchmark.py --output results-head
      - name: Compare on this runner
        if: github.event_name == 'pull_request'
        run: python3 scripts/compare_benchmarks.py results-base results-head | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect benchmark reports
        if: always()
        run: python3 scripts/collect_benchmark_artifacts.py --destination smoke-artifacts results-head results-base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke-artifacts/
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: benchmark-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-results
          path: results
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Smoke (relative to bedtools)
          tool: customSmallerIsBetter
          output-file-path: results/results-head/benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: dev/bench/smoke
          fail-on-alert: false
