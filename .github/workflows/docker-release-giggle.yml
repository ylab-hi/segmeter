name: docker-release-giggle
on:
  push:
    tags:
      - "*"
env:
  REGISTRY: docker.io
  IMAGE_NAME: segmeter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v2

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: extract version
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./containers/giggle/Dockerfile
          platforms: linux/amd64
          build-args: SEGMETER_REF=${{ steps.extract_version.outputs.VERSION }}
          push: true
          tags: yanglabinfo/segmeter:giggle-${{ steps.extract_version.outputs.VERSION }}, yanglabinfo/segmeter:giggle-latest
